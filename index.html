<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#197a45"><link rel="manifest" href="manifest.json"><title>چک‌یار خانواده</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef8f1;color:#173b28;font-family:Tahoma,Arial,sans-serif;padding:14px}main{max-width:560px;margin:auto}.head{background:#197a45;color:#fff;border-radius:24px;padding:18px;text-align:center}.head img{width:90px;height:90px;object-fit:cover;border-radius:20px;background:#fff}.head h1{font-size:29px;margin:8px 0}.head p{font-size:17px;margin:0}.date,.summary{background:#fff;border-radius:17px;padding:14px;margin:14px 0;text-align:center;font-size:19px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.act{min-height:145px;border:4px solid #ddd;border-radius:22px;background:#fff;font-size:21px;font-weight:bold;color:#173b28}.act b{display:block;font-size:48px;margin-bottom:8px}.act small{display:block;font-size:14px;margin-top:8px;color:#777}.med{border-color:#45a049}.shop{border-color:#f39c12}.exit{border-color:#2d8bd8}.family{border-color:#8e44ad}.sos{width:100%;margin:15px 0;padding:24px;border:0;border-radius:24px;background:#d62828;color:#fff;font-size:28px;font-weight:bold}.summary{text-align:right;font-size:17px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.ok{color:#16803c}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:430px;text-align:center}.box h2{margin-top:0;color:#197a45}.preview{background:#f2f2f2;border-radius:12px;padding:14px;margin:15px 0;font-size:18px}.send{display:grid;grid-template-columns:1fr 1fr;gap:10px}.send button,.close{border:0;border-radius:13px;padding:16px;font-size:17px;font-weight:bold}.sms{background:#3ba55c;color:#fff}.wa{background:#25d366;color:#fff}.tg{background:#229ed9;color:#fff}.call{background:#4285f4;color:#fff}.close{background:#eee;width:100%;margin-top:12px}@media(max-width:360px){.act{font-size:18px;min-height:130px}.act b{font-size:40px}}
</style></head><body><main><header class="head"><img src="icon-512.png" alt="لوگوی چک‌یار"><h1>چک‌یار خانواده</h1><p>یادآور مراقبت از عزیزان</p></header><div class="date" id="date"></div><section class="grid"><button class="act med" onclick="openSend('med','💊 دارو خوردم')"><b>💊</b>دارو<small id="s-med">انجام نشده</small></button><button class="act shop" onclick="openSend('shop','🛒 خرید و قبض انجام شد')"><b>🛒</b>خرید / قبض<small id="s-shop">انجام نشده</small></button><button class="act exit" onclick="openSend('exit','🚪 از خانه خارج شدم')"><b>🚪</b>اطلاع خروج<small id="s-exit">انجام نشده</small></button><button class="act family" onclick="callFamily()"><b>📞</b>تماس با خانواده<small>یک لمس</small></button></section><button class="sos" onclick="openSend('sos','🆘 کمک فوری لازم دارم! لطفاً سریع تماس بگیرید.')">🆘 کمک اضطراری</button><section class="summary"><div>📋 وضعیت امروز</div><div class="row"><span>دارو</span><span id="v-med">انجام نشده</span></div><div class="row"><span>خرید / قبض</span><span id="v-shop">انجام نشده</span></div><div class="row"><span>خروج</span><span id="v-exit">انجام نشده</span></div></section></main><div class="modal" id="modal"><div class="box"><h2>روش ارسال پیام</h2><div class="preview" id="preview"></div><div class="send"><button class="sms" onclick="sms()">📱 پیامک</button><button class="wa" onclick="whatsapp()">💬 واتساپ</button><button class="tg" onclick="telegram()">✈️ تلگرام</button><button class="call" onclick="callFamily()">📞 تماس</button></div><button class="close" onclick="closeModal()">بستن</button></div></div><script>
const FAMILY={phone:'09120000000',wa:'989120000000',telegram:'your_username'};let current=null,text='';const today=()=>new Date().toLocaleDateString('fa-IR');const key=x=>'chekyar_'+x+'_'+today();document.getElementById('date').textContent='📅 امروز: '+today();function openSend(k,t){current=k;text=t;document.getElementById('preview').textContent=t;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function done(){if(['med','shop','exit'].includes(current)){localStorage.setItem(key(current),'1');update()}closeModal()}function sms(){location.href='sms:'+FAMILY.phone+'?body='+encodeURIComponent(text);done()}function whatsapp(){window.open('https://wa.me/'+FAMILY.wa+'?text='+encodeURIComponent(text),'_blank');done()}function telegram(){window.open('https://t.me/'+FAMILY.telegram+'?text='+encodeURIComponent(text),'_blank');done()}function callFamily(){closeModal();location.href='tel:'+FAMILY.phone}function update(){[['med','med'],['shop','shop'],['exit','exit']].forEach(([k,id])=>{let ok=localStorage.getItem(key(k));document.getElementById('s-'+id).textContent=ok?'✅ انجام شد':'انجام نشده';let v=document.getElementById('v-'+id);v.textContent=ok?'✅ انجام شد':'انجام نشده';v.className=ok?'ok':''})}update();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
