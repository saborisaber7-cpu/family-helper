<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چک‌یار؛ همراه و مراقب خانواده شما</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e4620">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #eef4f1;
            margin: 0;
            padding: 15px;
            text-align: center;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 440px;
            background: #f8faf9;
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #1e4620, #2e7d32);
            color: white;
            padding: 20px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 4px 12px rgba(30, 70, 32, 0.2);
        }
        .settings-btn {
            position: absolute;
            left: 12px;
            top: 12px;
            background: rgba(255,255,255,0.25);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.4); }
        
        .logo-placeholder {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: white;
            color: #1e4620;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 8px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        h1 { margin: 5px 0 3px 0; font-size: 22px; }
        p { margin: 0; font-size: 12px; opacity: 0.95; }
        
        .date-box {
            background: white;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            color: #333;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .card {
            background: white;
            border-radius: 14px;
            padding: 18px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .card:active { transform: scale(0.96); }
        .card-med { border-color: #2e7d32; }
        .card-shop { border-color: #f57f17; }
        .card-call { border-color: #c62828; }
        .card-out { border-color: #0277bd; }
        
        .card .icon { font-size: 32px; margin-bottom: 8px; display: block; }
        .card span { font-size: 15px; font-weight: bold; display: block; color: #333; }
        .card small { font-size: 11px; color: #777; margin-top: 4px; display: block; }

        .sos-btn {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.35);
            cursor: pointer;
            transition: 0.2s;
        }
        .sos-btn:active { transform: scale(0.98); }

        /* Modal Settings */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 22px;
            border-radius: 16px;
            width: 90%;
            max-width: 340px;
            text-align: right;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-content h3 { margin-top: 0; font-size: 16px; color: #1e4620; }
        .modal-content label { font-size: 13px; font-weight: bold; color: #444; }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 16px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: #fafafa;
        }
        .modal-content button.save-btn {
            background: #1e4620;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 14px;
        }
        .modal-content button.close-btn {
            background: #777;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <button class="settings-btn" onclick="openSettings()">⚙️ تنظیمات</button>
            <div class="logo-placeholder">💚</div>
            <h1>چک‌یار</h1>
            <p>چک‌یار؛ همراه و مراقب خانواده شما</p>
        </div>

        <div class="date-box" id="current-date">
            📅 امروز: در حال بارگذاری...
        </div>

        <div class="grid">
            <div class="card card-shop" onclick="triggerAction('خرید / قبض')">
                <span class="icon">🛒</span>
                <span>خرید / قبض</span>
                <small id="status-shop">انجام نشده</small>
            </div>
            <div class="card card-med" onclick="triggerAction('دارو')">
                <span class="icon">💊</span>
                <span>دارو</span>
                <small id="status-med">انجام نشده</small>
            </div>
            <div class="card card-out" onclick="triggerAction('اطلاع خروج')">
                <span class="icon">🚪</span>
                <span>اطلاع خروج</span>
                <small id="status-out">انجام نشده</small>
            </div>
            <div class="card card-call" onclick="makeCall()">
                <span class="icon">📞</span>
                <span>تماس با خانواده</span>
                <small>یک لمس</small>
            </div>
        </div>

        <button class="sos-btn" onclick="triggerSOS()">🚨 کمک اضطراری (SOS)</button>
    </div>

    <!-- Modal Settings -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>⚙️ تنظیمات شماره تماس خانواده</h3>
            <label>نام فرزند / مراقب:</label>
            <input type="text" id="famName1" placeholder="مثلاً علی (پسر)">
            <label>شماره موبایل:</label>
            <input type="text" id="famPhone1" placeholder="09120000000">
            
            <button class="save-btn" onclick="saveSettings()">ذخیره تنظیمات</button>
            <button class="close-btn" onclick="closeSettings()">بستن</button>
        </div>
    </div>

    <script>
        const options = { year: 'numeric', month: 'long', day: 'numeric', calendar: 'persian' };
        document.getElementById('current-date').innerText = "📅 امروز: " + new Date().toLocaleDateString('fa-IR', options);

        function getFamilyPhone() {
            return localStorage.getItem('famPhone') || '09120000000';
        }

        function openSettings() {
            document.getElementById('famName1').value = localStorage.getItem('famName') || 'فرزند';
            document.getElementById('famPhone1').value = getFamilyPhone();
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveSettings() {
            const name = document.getElementById('famName1').value;
            const phone = document.getElementById('famPhone1'].value;
            localStorage.setItem('famName', name);
            localStorage.setItem('famPhone', phone);
            alert('تنظیمات با موفقیت ذخیره شد!');
            closeSettings();
        }

        function makeCall() {
            const phone = getFamilyPhone();
            window.location.href = `tel:${phone}`;
        }

        function triggerAction(actionName) {
            const phone = getFamilyPhone();
            const message = encodeURIComponent(`سلام، درخواست سالمند در بخش: ${actionName} ثبت شد.`);
            if(confirm(`آیا می‌خواهید درخواست «${actionName}» را برای خانواده ارسال کنید؟`)) {
                localStorage.setItem(actionName, 'انجام شد');
                updateStatuses();
                window.location.href = `https://wa.me/98${phone.replace(/^0+/, '')}?text=${message}`;
            }
        }

        function triggerSOS() {
            const phone = getFamilyPhone();
            if(confirm('⚠️ آیا نیاز به کمک اضطراری دارید؟')) {
                window.location.href = `tel:${phone}`;
            }
        }

        function updateStatuses() {
            if(localStorage.getItem('خرید / قبض') === 'انجام شد') document.getElementById('status-shop').innerText = 'انجام شد ✅';
            if(localStorage.getItem('دارو') === 'انجام شد') document.getElementById('status-med').innerText = 'انجام شد ✅';
            if(localStorage.getItem('اطلاع خروج') === 'انجام شد') document.getElementById('status-out').innerText = 'انجام شد ✅';
        }

        updateStatuses();
    </script>
</body>
</html>
