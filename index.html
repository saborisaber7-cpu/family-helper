<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>چک‌یار - همراه سالمند</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b5e20">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    body { 
      background-color: #f0f4f1; 
      color: #2e3d32; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 12px; 
    }
    .container { 
      width: 100%; 
      max-width: 440px; 
      background: #ffffff; 
      border-radius: 24px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
      padding: 18px; 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
      position: relative; 
    }
    
    /* هدر با تفکیک کامل عنوان و دکمه تنظیمات */
    .header { 
      background: linear-gradient(135deg, #1b5e20, #2e7d32); 
      color: white; 
      padding: 16px; 
      border-radius: 18px; 
    }
    .header-top { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .title-area { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    .app-title { 
      font-size: 20px; 
      font-weight: 800; 
    }
    .settings-btn { 
      background: rgba(255,255,255,0.2); 
      border: none; 
      font-size: 20px; 
      width: 38px; 
      height: 38px; 
      border-radius: 50%; 
      color: white; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .header-info { 
      margin-top: 10px; 
      font-size: 13px; 
      opacity: 0.9; 
      display: flex; 
      justify-content: space-between; 
    }

    /* کارت‌های اصلی ۴ تایی */
    .cards-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
    }
    .card { 
      background: #f9fbf9; 
      border: 2px solid #e0ebd0; 
      border-radius: 18px; 
      padding: 16px 12px; 
      text-align: center; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 125px; 
      transition: transform 0.1s, border-color 0.2s; 
    }
    .card:active { 
      transform: scale(0.97); 
    }
    .card.completed { 
      background: #e8f5e9; 
      border-color: #4caf50; 
    }
    .card-icon { 
      font-size: 34px; 
      margin-bottom: 6px; 
    }
    .card-title { 
      font-size: 16px; 
      font-weight: 700; 
      color: #1b5e20; 
    }
    .card-status { 
      font-size: 11px; 
      margin-top: 5px; 
      color: #757575; 
      font-weight: 600; 
    }
    .card.completed .card-status { 
      color: #2e7d32; 
    }

    /* دکمه‌های مستقیم تماس و SOS */
    .quick-call-btn { 
      background: #2e7d32; 
      color: white; 
      border: none; 
      border-radius: 16px; 
      padding: 14px; 
      font-size: 16px; 
      font-weight: bold; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      cursor: pointer; 
      width: 100%; 
    }
    .sos-btn { 
      background: linear-gradient(135deg, #d32f2f, #b71c1c); 
      color: white; 
      border: none; 
      border-radius: 18px; 
      padding: 16px; 
      font-size: 18px; 
      font-weight: 900; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      cursor: pointer; 
      box-shadow: 0 6px 16px rgba(211,47,47,0.3); 
      width: 100%; 
    }
    
    /* پنجره‌های مودال */
    .modal-overlay { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.55); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      padding: 16px; 
      z-index: 100; 
    }
    .modal-overlay.active { 
      display: flex; 
    }
    .modal-box { 
      background: white; 
      border-radius: 22px; 
      width: 100%; 
      max-width: 380px; 
      padding: 20px; 
      box-shadow: 0 16px 32px rgba(0,0,0,0.2); 
    }
    .modal-title { 
      font-size: 17px; 
      font-weight: 800; 
      color: #1b5e20; 
      margin-bottom: 14px; 
    }
    .form-group { 
      margin-bottom: 12px; 
    }
    .form-group label { 
      display: block; 
      font-size: 12px; 
      font-weight: bold; 
      margin-bottom: 5px; 
      color: #555; 
    }
    .form-control { 
      width: 100%; 
      padding: 10px 12px; 
      border: 1.5px solid #cfd8dc; 
      border-radius: 12px; 
      font-size: 14px; 
      outline: none; 
    }
    .quick-chips { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 6px; 
      margin-top: 6px; 
    }
    .chip { 
      background: #f0f4f1; 
      border: 1px solid #d0e0d0; 
      padding: 5px 10px; 
      border-radius: 8px; 
      font-size: 12px; 
      cursor: pointer; 
    }
    .modal-actions { 
      display: flex; 
      gap: 8px; 
      margin-top: 18px; 
    }
    .btn-submit { 
      flex: 2; 
      background: #2e7d32; 
      color: white; 
      border: none; 
      border-radius: 12px; 
      padding: 12px; 
      font-weight: bold; 
      cursor: pointer; 
    }
    .btn-cancel { 
      flex: 1; 
      background: #eceff1; 
      color: #455a64; 
      border: none; 
      border-radius: 12px; 
      padding: 12px; 
      font-weight: bold; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

<div class="container">
  <!-- هدر -->
  <div class="header">
    <div class="header-top">
      <div class="title-area">
        <span style="font-size: 24px;">🌿</span>
        <div class="app-title">چک‌یار</div>
      </div>
      <button class="settings-btn" onclick="openSettings()" title="تنظیمات">⚙️</button>
    </div>
    <div class="header-info">
      <div>مراقب: <span id="header-caregiver-name">مراقب اصلی</span></div>
      <div id="jalali-date">امروز</div>
    </div>
  </div>

  <!-- کارت‌های دسترسی سریع -->
  <div class="cards-grid">
    <div class="card" id="card-med" onclick="openMedModal()">
      <div class="card-icon">💊</div>
      <div class="card-title">مصرف دارو</div>
      <div class="card-status" id="status-med">انجام نشده</div>
    </div>
    <div class="card" id="card-shop" onclick="openShopModal()">
      <div class="card-icon">🛒</div>
      <div class="card-title">خرید و قبوض</div>
      <div class="card-status" id="status-shop">انجام نشده</div>
    </div>
    <div class="card" id="card-exit" onclick="openExitModal()">
      <div class="card-icon">🚪</div>
      <div class="card-title">اطلاع خروج</div>
      <div class="card-status" id="status-exit">در منزل</div>
    </div>
    <div class="card" onclick="makeQuickCall()">
      <div class="card-icon">📞</div>
      <div class="card-title">تماس سریع</div>
      <div class="card-status">با مراقب</div>
    </div>
  </div>

  <button class="quick-call-btn" onclick="makeQuickCall()">📞 تماس تلفنی با مراقب</button>
  <button class="sos-btn" onclick="sendSOS()">🚨 درخواست فوری (SOS)</button>
</div>

<!-- پنجره مودال تنظیمات -->
<div class="modal-overlay" id="modal-settings">
  <div class="modal-box">
    <div class="modal-title">⚙️ تنظیمات و شماره مراقب</div>
    <div class="form-group">
      <label>نام مراقب / فرزند:</label>
      <input type="text" id="cfg-name" class="form-control" placeholder="مثلاً: علی (پسرم)">
    </div>
    <div class="form-group">
      <label>شماره تماس مراقب (قابل ویرایش):</label>
      <input type="tel" id="cfg-phone" class="form-control" placeholder="0912xxxxxxx" dir="ltr">
    </div>
    <div class="modal-actions">
      <button class="btn-submit" onclick="saveSettings()">ذخیره تنظیمات</button>
      <button class="btn-cancel" onclick="closeModals()">بستن</button>
    </div>
  </div>
</div>

<!-- پنجره مودال ثبت دارو -->
<div class="modal-overlay" id="modal-med">
  <div class="modal-box">
    <div class="modal-title">💊 ثبت مصرف دارو</div>
    <div class="form-group">
      <label>نام دارو:</label>
      <input type="text" id="med-name" class="form-control" placeholder="مثلاً: قرص فشار">
      <div class="quick-chips">
        <span class="chip" onclick="setMedName('قرص فشار')">قرص فشار</span>
        <span class="chip" onclick="setMedName('قرص قند')">قرص قند</span>
        <span class="chip" onclick="setMedName('انسولین')">انسولین</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-submit" onclick="confirmMedAction()">تایید و ارسال پیامک</button>
      <button class="btn-cancel" onclick="closeModals()">انصراف</button>
    </div>
  </div>
</div>

<!-- پنجره مودال خرید -->
<div class="modal-overlay" id="modal-shop">
  <div class="modal-box">
    <div class="modal-title">🛒 خرید یا پرداخت قبض</div>
    <div class="form-group">
      <label>توضیح:</label>
      <input type="text" id="shop-desc" class="form-control" placeholder="مثلاً: خرید نان">
      <div class="quick-chips">
        <span class="chip" onclick="setShopDesc('خرید نان و لبنیات')">خرید نان</span>
        <span class="chip" onclick="setShopDesc('پرداخت قبض آب/برق')">پرداخت قبض</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-submit" onclick="confirmShopAction()">تایید و ارسال پیامک</button>
      <button class="btn-cancel" onclick="closeModals()">انصراف</button>
    </div>
  </div>
</div>

<!-- پنجره مودال خروج -->
<div class="modal-overlay" id="modal-exit">
  <div class="modal-box">
    <div class="modal-title">🚪 اطلاع خروج از منزل</div>
    <div class="form-group">
      <label>مقصد:</label>
      <input type="text" id="exit-dest" class="form-control" placeholder="مثلاً: نانوایی">
      <div class="quick-chips">
        <span class="chip" onclick="setExitDest('نانوایی')">نانوایی</span>
        <span class="chip" onclick="setExitDest('پیاده‌روی')">پیاده‌روی</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-submit" onclick="confirmExitAction()">تایید و خروج</button>
      <button class="btn-cancel" onclick="closeModals()">انصراف</button>
    </div>
  </div>
</div>

<script>
  let chekyarData = JSON.parse(localStorage.getItem('chekyar_v5')) || {
    caregiverPhone: '09120000000',
    caregiverName: 'مراقب اصلی',
    actions: { med: { done: false }, shop: { done: false }, exit: { done: false } }
  };

  document.getElementById('jalali-date').innerText = new Intl.DateTimeFormat('fa-IR').format(new Date());

  function initUI() {
    document.getElementById('header-caregiver-name').innerText = chekyarData.caregiverName;
    document.getElementById('cfg-name').value = chekyarData.caregiverName;
    document.getElementById('cfg-phone').value = chekyarData.caregiverPhone;
    updateCardUI('med', chekyarData.actions.med.done, 'انجام شد');
    updateCardUI('shop', chekyarData.actions.shop.done, 'درخواست شد');
    updateCardUI('exit', chekyarData.actions.exit.done, 'خارج از منزل');
  }

  function updateCardUI(id, isDone, label) {
    const card = document.getElementById('card-' + id);
    const status = document.getElementById('status-' + id);
    if (isDone) {
      card.classList.add('completed');
      status.innerText = label;
    } else {
      card.classList.remove('completed');
      status.innerText = (id === 'exit' ? 'در منزل' : 'انجام نشده');
    }
  }

  function openSettings() { document.getElementById('modal-settings').classList.add('active'); }
  function openMedModal() { document.getElementById('modal-med').classList.add('active'); }
  function openShopModal() { document.getElementById('modal-shop').classList.add('active'); }
  function openExitModal() { document.getElementById('modal-exit').classList.add('active'); }
  function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }

  function setMedName(v) { document.getElementById('med-name').value = v; }
  function setShopDesc(v) { document.getElementById('shop-desc').value = v; }
  function setExitDest(v) { document.getElementById('exit-dest').value = v; }

  function saveSettings() {
    chekyarData.caregiverName = document.getElementById('cfg-name').value || 'مراقب';
    chekyarData.caregiverPhone = document.getElementById('cfg-phone').value || '';
    localStorage.setItem('chekyar_v5', JSON.stringify(chekyarData));
    initUI();
    closeModals();
  }

  function sendSMS(msg) {
    window.location.href = `sms:${chekyarData.caregiverPhone}?body=${encodeURIComponent(msg)}`;
  }

  function makeQuickCall() {
    window.location.href = `tel:${chekyarData.caregiverPhone}`;
  }

  function confirmMedAction() {
    const med = document.getElementById('med-name').value || 'دارو';
    chekyarData.actions.med.done = true;
    localStorage.setItem('chekyar_v5', JSON.stringify(chekyarData));
    updateCardUI('med', true, 'انجام شد');
    sendSMS(`✅ دارو مصرف شد: ${med}`);
    closeModals();
  }

  function confirmShopAction() {
    const desc = document.getElementById('shop-desc').value || 'خرید/قبض';
    chekyarData.actions.shop.done = true;
    localStorage.setItem('chekyar_v5', JSON.stringify(chekyarData));
    updateCardUI('shop', true, 'درخواست شد');
    sendSMS(`🛒 درخواست خرید/قبض: ${desc}`);
    closeModals();
  }

  function confirmExitAction() {
    const dest = document.getElementById('exit-dest').value || 'بیرون';
    chekyarData.actions.exit.done = true;
    localStorage.setItem('chekyar_v5', JSON.stringify(chekyarData));
    updateCardUI('exit', true, 'خارج از منزل');
    sendSMS(`🚪 خروج از منزل به مقصد: ${dest}`);
    closeModals();
  }

  function sendSOS() {
    if(confirm("آیا از ارسال پیامک درخواست کمک فوری اطمینان دارید؟")) {
      sendSMS("🚨 کمک فوری! من نیاز به کمک دارم. لطفاً تماس بگیرید.");
      setTimeout(makeQuickCall, 1200);
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  initUI();
</script>
</body>
</html>
