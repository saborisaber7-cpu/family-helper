<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>چک‌یار خانواده</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e4620">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-main: #333;
            --color-meds: #1a73e8; /* آبی تیره */
            --color-bills: #e67e22; /* نارنجی تیره */
            --color-exit: #27ae60; /* سبز تیره */
            --color-call: #8e44ad; /* بنفش تیره */
            --color-sos: #c0392b; /* قرمز تیره */
        }

        body {
            font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-main);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            margin: 0;
            color: #1e4620;
        }

        .header p {
            font-size: 20px;
            margin: 5px 0;
            color: #555;
        }

        /* استایل دکمه‌های اصلی */
        .main-btn {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100px;
            border: none;
            border-radius: 12px;
            margin-bottom: 16px;
            padding: 0 20px;
            color: white;
            text-align: right;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .main-btn:active {
            transform: scale(0.98);
        }

        .btn-icon {
            font-size: 48px;
            margin-left: 20px;
        }

        .btn-text-box {
            display: flex;
            flex-direction: column;
        }

        .btn-title {
            font-size: 26px;
            font-weight: bold;
        }

        .btn-status {
            font-size: 18px;
            opacity: 0.9;
        }

        /* رنگ‌بندی دکمه‌ها */
        .btn-meds { background-color: var(--color-meds); }
        .btn-bills { background-color: var(--color-bills); }
        .btn-exit { background-color: var(--color-exit); }
        .btn-call { background-color: var(--color-call); }
        .btn-sos { 
            background-color: var(--color-sos);
            position: sticky;
            bottom: 10px;
            margin-top: 10px;
            justify-content: center;
        }

        /* مودال‌ها (پنجره‌های بازشو) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 500px;
            margin: 40px auto;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            text-align: center;
        }

        .item-card {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .item-card.done {
            border-color: #27ae60;
            background-color: #f0fff4;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border-radius: 8px;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }

        .btn-confirm { background-color: #27ae60; color: white; }
        .btn-secondary { background-color: #e67e22; color: white; }
        .btn-close { background-color: #95a5a6; color: white; margin-top: 20px; }
        
        .sos-hold-btn {
            background-color: var(--color-sos);
            color: white;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            text-align: center;
            border: 6px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .time-label {
            font-size: 16px;
            color: #27ae60;
            font-weight: bold;
            display: block;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>چک‌یار خانواده</h1>
        <p>سلام، مادر عزیز</p>
        <p id="current-date"></p>
    </div>

    <!-- ۱. داروهای من -->
    <button class="main-btn btn-meds" onclick="openModal('medsModal')">
        <span class="btn-icon">💊</span>
        <div class="btn-text-box">
            <span class="btn-title">داروهای من</span>
            <span class="btn-status" id="med-status">۲ مورد برای امروز</span>
        </div>
    </button>

    <!-- ۲. خرید و پرداخت قبض -->
    <button class="main-btn btn-bills" onclick="openModal('billsModal')">
        <span class="btn-icon">🛒</span>
        <div class="btn-text-box">
            <span class="btn-title">خرید و پرداخت قبض</span>
            <span class="btn-status" id="bill-status">۱ کار باقی‌مانده</span>
        </div>
    </button>

    <!-- ۳. من بیرون می‌روم -->
    <button class="main-btn btn-exit" id="exit-btn" onclick="toggleExitStatus()">
        <span class="btn-icon" id="exit-icon">🚶</span>
        <div class="btn-text-box">
            <span class="btn-title" id="exit-title">من بیرون می‌روم</span>
            <span class="btn-status">اطلاع به خانواده</span>
        </div>
    </button>

    <!-- ۴. تماس با خانواده -->
    <button class="main-btn btn-call" onclick="openModal('callModal')">
        <span class="btn-icon">📞</span>
        <div class="btn-text-box">
            <span class="btn-title">تماس با خانواده</span>
            <span class="btn-status">تماس سریع</span>
        </div>
    </button>

    <!-- ۵. کمک فوری (ثابت) -->
    <button class="main-btn btn-sos" onclick="openModal('sosModal')">
        <span class="btn-icon">🆘</span>
        <div class="btn-text-box">
            <span class="btn-title">کمک فوری</span>
        </div>
    </button>

    <!-- مودال داروها -->
    <div id="medsModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">💊 داروهای امروز</div>
            <div class="item-card" id="med-item-1">
                <h3 style="font-size:22px; margin:0;">قرص فشار خون</h3>
                <p style="font-size:18px;">ساعت ۸ صبح</p>
                <button class="action-btn btn-confirm" onclick="markDone('med', 1)">دارو را خوردم ✅</button>
                <span class="time-label" id="med-time-1"></span>
            </div>
            <div class="item-card" id="med-item-2">
                <h3 style="font-size:22px; margin:0;">قرص قند</h3>
                <p style="font-size:18px;">ساعت ۱۲ ظهر</p>
                <button class="action-btn btn-confirm" onclick="markDone('med', 2)">دارو را خوردم ✅</button>
                <span class="time-label" id="med-time-2"></span>
            </div>
            <button class="action-btn btn-close" onclick="closeModal('medsModal')">بازگشت</button>
        </div>
    </div>

    <!-- مودال خرید و قبض -->
    <div id="billsModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🛒 خرید و قبض‌ها</div>
            <div class="item-card" id="bill-item-1">
                <h3 style="font-size:22px;">🛒 خرید</h3>
                <button class="action-btn btn-confirm" onclick="markDone('bill', 1)">نان و شیر را خریدم ✅</button>
            </div>
            <div class="item-card">
                <h3 style="font-size:22px;">🧾 قبض‌ها</h3>
                <button class="action-btn btn-secondary" onclick="alert('درخواست پرداخت به فرزند ارسال شد 📲')">از فرزندم بخواهید پرداخت کند 📲</button>
            </div>
            <button class="action-btn btn-close" onclick="closeModal('billsModal')">بازگشت</button>
        </div>
    </div>

    <!-- مودال تماس -->
    <div id="callModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">📞 تماس با خانواده</div>
            <a href="tel:09120000000" style="text-decoration:none">
                <button class="action-btn btn-confirm" style="background-color:var(--color-call)">تماس با فرزند اول 📞</button>
            </a>
            <a href="tel:09120000001" style="text-decoration:none">
                <button class="action-btn btn-confirm" style="background-color:var(--color-call); margin-top:15px;">تماس با فرزند دوم 📞</button>
            </a>
            <button class="action-btn btn-close" onclick="closeModal('callModal')">بازگشت</button>
        </div>
    </div>

    <!-- مودال SOS -->
    <div id="sosModal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <div class="modal-title">🆘 درخواست کمک فوری</div>
            <p style="font-size:20px;">برای ارسال هشدار، دکمه زیر را ۳ ثانیه نگه دارید:</p>
            <div class="sos-hold-btn" id="sos-btn" onmousedown="startSOS()" onmouseup="stopSOS()" ontouchstart="startSOS()" ontouchend="stopSOS()">
                ۳ ثانیه<br>نگه دارید
            </div>
            <button class="action-btn btn-close" onclick="closeModal('sosModal')">لغو</button>
        </div>
    </div>

    <script>
        // نمایش تاریخ شمسی
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('fa-IR', { weekday: 'long', day: 'numeric', month: 'long' });

        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // وضعیت خروج
        let isOut = false;
        function toggleExitStatus() {
            if(!isOut) {
                if(confirm("آیا از خانه خارج می‌شوید؟")) {
                    isOut = true;
                    document.getElementById('exit-btn').style.backgroundColor = "#c0392b";
                    document.getElementById('exit-icon').innerText = "🏠";
                    document.getElementById('exit-title').innerText = "به خانه برگشتم";
                    alert("پیام «مادر از خانه خارج شد» ثبت شد.");
                }
            } else {
                isOut = false;
                document.getElementById('exit-btn').style.backgroundColor = "var(--color-exit)";
                document.getElementById('exit-icon').innerText = "🚶";
                document.getElementById('exit-title').innerText = "من بیرون می‌روم";
                alert("خوش آمدید، بازگشت شما ثبت شد.");
            }
        }

        // ثبت انجام کارها
        function markDone(type, id) {
            const card = document.getElementById(`${type}-item-${id}`);
            card.classList.add('done');
            const btn = card.querySelector('.btn-confirm');
            btn.style.display = 'none';
            
            if(type === 'med') {
                const now = new Date().toLocaleTimeString('fa-IR', {hour: '2-digit', minute:'2-digit'});
                document.getElementById(`med-time-${id}`).innerText = `امروز ساعت ${now} ثبت شد. ✅`;
            }
        }

        // دکمه اضطراری 3 ثانیه‌ای
        let sosTimer;
        function startSOS() {
            let count = 3;
            const sosBtn = document.getElementById('sos-btn');
            sosBtn.style.backgroundColor = "#ff0000";
            sosBtn.innerText = count;
            
            sosTimer = setInterval(() => {
                count--;
                sosBtn.innerText = count;
                if(count <= 0) {
                    clearInterval(sosTimer);
                    sosBtn.innerText = "در حال تماس...";
                    window.location.href = "tel:09120000000";
                }
            }, 1000);
        }

        function stopSOS() {
            clearInterval(sosTimer);
            const sosBtn = document.getElementById('sos-btn');
            sosBtn.style.backgroundColor = "var(--color-sos)";
            sosBtn.innerText = "۳ ثانیه نگه دارید";
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
