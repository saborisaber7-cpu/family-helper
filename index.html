<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چک‌یار؛ همراه و مراقب خانواده</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e4620">
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f2f7f4;
            margin: 0;
            padding: 10px;
            text-align: center;
            color: #2c3e50;
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            background-color: #1e4620;
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            position: relative;
        }
        .settings-btn {
            position: absolute;
            left: 10px;
            top: 10px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 6px;
            background: white;
            padding: 3px;
        }
        h1 { margin: 4px 0; font-size: 20px; }
        p { margin: 0; font-size: 13px; opacity: 0.9; }
        
        .date-box {
            background: white;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 15px 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
        }
        .card:active { transform: scale(0.96); }
        .card-med { border-color: #2e7d32; }
        .card-shop { border-color: #f57f17; }
        .card-call { border-color: #c62828; }
        .card-out { border-color: #0277bd; }
        
        .card .icon { font-size: 28px; margin-bottom: 6px; display: block; }
        .card span { font-size: 15px; font-weight: bold; display: block; }
        .card small { font-size: 11px; color: #666; }

        .sos-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.4);
            cursor: pointer;
            margin-bottom: 15px;
        }
        .sos-btn:active { transform: scale(0.98); }

        /* Modal Settings */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 85%;
            max-width: 350px;
            text-align: right;
        }
        .modal-content input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-content button {
            background: #1e4620;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="settings-btn" onclick="openSettings()">⚙️ تنظیمات</button>
        <img src="icon-512.png" alt="لوگو" class="logo-img">
        <h1>چک‌یار</h1>
        <p>چک‌یار؛ همراه و مراقب خانواده شما</p>
    </div>

    <div class="date-box" id="current-date">
        📅 امروز: در حال بارگذاری...
    </div>

    <div class="grid">
        <div class="card card-shop" onclick="triggerAction('خرید / قبض')">
            <span class="icon">🛒</span>
            <span>خرید / قبض</span>
            <small id="status-shop">انجام نشده</small>
        </div>
        <div class="card card-med" onclick="triggerAction('دارو')">
            <span class="icon">💊</span>
            <span>دارو</span>
            <small id="status-med">انجام نشده</small>
        </div>
        <div class="card card-out" onclick="triggerAction('اطلاع خروج')">
            <span class="icon">🚪</span>
            <span>اطلاع خروج</span>
            <small id="status-out">انجام نشده</small>
        </div>
        <div class="card card-call" onclick="makeCall()">
            <span class="icon">📞</span>
            <span>تماس با خانواده</span>
            <small>یک لمس</small>
        </div>
    </div>

    <button class="sos-btn" onclick="triggerSOS()">🚨 کمک اضطراری (SOS)</button>

    <!-- Modal Settings -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>⚙️ تنظیمات شماره تماس خانواده</h3>
            <label>نام فرزند / مراقب:</label>
            <input type="text" id="famName1" placeholder="مثلاً علی (پسر)">
            <label>شماره موبایل (مثلاً 09120000000):</label>
            <input type="text" id="famPhone1" placeholder="09120000000">
            
            <button onclick="saveSettings()">ذخیره تنظیمات</button>
            <br><br>
            <button onclick="closeSettings()" style="background: #777;">بستن</button>
        </div>
    </div>

    <script>
        const options = { year: 'numeric', month: 'long', day: 'numeric', calendar: 'persian' };
        document.getElementById('current-date').innerText = "📅 امروز: " + new Date().toLocaleDateString('fa-IR', options);

        function getFamilyPhone() {
            return localStorage.getItem('famPhone') || '09120000000';
        }

        function openSettings() {
            document.getElementById('famName1').value = localStorage.getItem('famName') || 'فرزند';
            document.getElementById('famPhone1').value = getFamilyPhone();
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveSettings() {
            const name = document.getElementById('famName1').value;
            const phone = document.getElementById('famPhone1').value;
            localStorage.setItem('famName', name);
            localStorage.setItem('famPhone', phone);
            alert('تنظیمات با موفقیت ذخیره شد!');
            closeSettings();
        }

        function makeCall() {
            const phone = getFamilyPhone();
            window.location.href = `tel:${phone}`;
        }

        function triggerAction(actionName) {
            const phone = getFamilyPhone();
            const message = encodeURIComponent(`سلام، درخواست سالمند در بخش: ${actionName} ثبت شد.`);
            if(confirm(`آیا می‌خواهید درخواست «${actionName}» را برای خانواده ارسال کنید؟`)) {
                localStorage.setItem(actionName, 'انجام شد');
                updateStatuses();
                window.location.href = `https://wa.me/98${phone.replace(/^0+/, '')}?text=${message}`;
            }
        }

        function triggerSOS() {
            const phone = getFamilyPhone();
            if(confirm('⚠️ آیا نیاز به کمک اضطراری دارید؟')) {
                window.location.href = `tel:${phone}`;
            }
        }

        function updateStatuses() {
            if(localStorage.getItem('خرید / قبض') === 'انجام شد') document.getElementById('status-shop').innerText = 'انجام شد ✅';
            if(localStorage.getItem('دارو') === 'انجام شد') document.getElementById('status-med').innerText = 'انجام شد ✅';
            if(localStorage.getItem('اطلاع خروج') === 'انجام شد') document.getElementById('status-out').innerText = 'انجام شد ✅';
        }

        updateStatuses();
    </script>
</body>
</html>
