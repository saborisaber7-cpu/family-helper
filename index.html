<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>چک‌یار؛ همراه و مراقب خانواده</title>
  <meta name="theme-color" content="#1e4620">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #eef4f1; --green: #1e4620; --green2: #2e7d32; --text: #234;
      --muted: #6b7280; --shadow: 0 10px 28px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: system-ui, -apple-system, Tahoma, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; }
    .app { width: 100%; max-width: 430px; background: #fff; border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
    .hero { background: linear-gradient(135deg, var(--green), var(--green2)); color: #fff; padding: 18px 16px; position: relative; text-align: center; }
    .settings-btn { position: absolute; left: 12px; top: 12px; border: 0; border-radius: 10px; background: rgba(255,255,255,.2); color: #fff; padding: 8px 12px; font-weight: 700; cursor: pointer; }
    .logo { width: 70px; height: 70px; border-radius: 50%; background: #fff; padding: 4px; object-fit: contain; }
    h1 { margin: 8px 0 2px; font-size: 22px; font-weight: 900; }
    .subtitle { margin: 0; font-size: 13px; opacity: .9; }
    .content { padding: 16px; }
    .date { background: #f4fbf6; border: 1px solid #cde7d1; color: var(--green); padding: 8px; border-radius: 12px; margin-bottom: 12px; font-weight: 800; font-size: 13px; text-align: center; }
    .contact-box { background: #f8fafb; border: 1px solid #e5e7eb; border-radius: 14px; padding: 10px; margin-bottom: 12px; text-align: right; }
    .contact-box .lbl { font-size: 12px; color: var(--muted); }
    .contact-box .val { font-size: 14px; font-weight: 800; color: #1f2937; margin-top: 2px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .card { background: #fff; border-radius: 16px; padding: 16px 8px; box-shadow: 0 3px 10px rgba(0,0,0,.04); cursor: pointer; border: 2px solid #e5e7eb; text-align: center; transition: .1s; }
    .card:active { transform: scale(0.96); background: #f0fdf4; }
    .card .icon { font-size: 32px; display: block; margin-bottom: 4px; }
    .card span { display: block; font-size: 14px; font-weight: 800; }
    .card small { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
    .card.done { border-color: #9ad59f; background: #f5fbf6; }
    .card.done small { color: var(--green2); font-weight: 800; }
    .sos { width: 100%; border: 0; border-radius: 16px; padding: 16px; background: linear-gradient(135deg,#d32f2f,#b71c1c); color: #fff; font-size: 17px; font-weight: 900; box-shadow: 0 6px 18px rgba(211,47,47,.25); cursor: pointer; }
    .sos:active { transform: scale(0.97); }
    .footer-btn { margin-top: 10px; width: 100%; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 12px; padding: 10px; font-weight: 800; cursor: pointer; color: #334155; }
    
    /* مودال تنظیمات */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 9999; align-items: center; justify-content: center; padding: 14px; }
    .modal-content { width: 100%; max-width: 380px; background: #fff; border-radius: 18px; padding: 18px; text-align: right; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border: 1.5px solid #d0d7de; border-radius: 8px; font-size: 14px; }
    .save-btn { width: 100%; border: 0; border-radius: 10px; padding: 12px; background: var(--green); color: #fff; font-weight: 800; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

<div class="app">
  <div class="hero">
    <button type="button" class="settings-btn" id="btn-settings">⚙️ شماره‌ها</button>
    <img src="icon-512.png" alt="لوگو" class="logo" onerror="this.src='icon-192.png'">
    <h1>چک‌یار</h1>
    <p class="subtitle">همراه و مراقب خانواده شما</p>
  </div>

  <div class="content">
    <div class="date" id="date-label">📅 امروز فعال است</div>

    <div class="contact-box">
      <div class="lbl">مخاطب اصلی:</div>
      <div class="val" id="contact-view">ثبت نشده</div>
    </div>

    <div class="grid">
      <div class="card" id="card-shop">
        <span class="icon">🛒</span><span>خرید / قبض</span><small id="st-shop">انجام نشده</small>
      </div>
      <div class="card" id="card-med">
        <span class="icon">💊</span><span>مصرف دارو</span><small id="st-med">انجام نشده</small>
      </div>
      <div class="card" id="card-out">
        <span class="icon">🚪</span><span>اطلاع خروج</span><small id="st-out">انجام نشده</small>
      </div>
      <div class="card" id="card-call">
        <span class="icon">📞</span><span>تماس سریع</span><small>تماس تلفنی</small>
      </div>
    </div>

    <button type="button" class="sos" id="btn-sos">🚨 کمک اضطراری (SOS)</button>
    <button type="button" class="footer-btn" id="btn-settings-bottom">ویرایش مخاطبین مراقب</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 style="margin-top:0">⚙️ تنظیم مخاطب</h3>
    <div class="field">
      <label>نام مراقب</label>
      <input type="text" id="inp-name" placeholder="مثلاً: فرزند ۱">
    </div>
    <div class="field">
      <label>شماره تماس (پیامک و تماس)</label>
      <input type="tel" id="inp-phone" placeholder="09120000000" dir="ltr">
    </div>
    <button type="button" class="save-btn" id="btn-save">ذخیره و تأیید</button>
  </div>
</div>

<script>
  // تابع تضمین شده برای باز کردن پروتکل‌های بومی در وب‌ویو و موبایل
  function directOpen(url) {
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 200);
  }

  function getContact() {
    return {
      name: localStorage.getItem('cy_name') || 'فرزند (مراقب)',
      phone: localStorage.getItem('cy_phone') || '09120000000'
    };
  }

  function updateDisplay() {
    const c = getContact();
    document.getElementById('contact-view').innerText = `${c.name} (${c.phone})`;
    
    ['shop', 'med', 'out'].forEach(k => {
      const isDone = localStorage.getItem('cy_' + k) === '1';
      document.getElementById('st-' + k).innerText = isDone ? 'انجام شد ✅' : 'انجام نشده';
      document.getElementById('card-' + k).classList.toggle('done', isDone);
    });
  }

  function handleAction(type, text) {
    const c = getContact();
    localStorage.setItem('cy_' + type, '1');
    updateDisplay();
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const sep = isIOS ? '&' : '?';
    directOpen(`sms:${c.phone}${sep}body=${encodeURIComponent(text)}`);
  }

  // ثبت ایونت لیسنرهای مستقیم (جلوگیری از مسدود شدن onclick)
  document.getElementById('card-shop').addEventListener('click', () => {
    handleAction('shop', 'پیام از چک‌یار: خرید یا قبض من پرداخت و انجام شد.');
  });

  document.getElementById('card-med').addEventListener('click', () => {
    handleAction('med', 'پیام از چک‌یار: داروی من به موقع مصرف شد.');
  });

  document.getElementById('card-out').addEventListener('click', () => {
    handleAction('out', 'پیام از چک‌یار: من در حال حاضر از منزل خارج شدم.');
  });

  document.getElementById('card-call').addEventListener('click', () => {
    const c = getContact();
    directOpen(`tel:${c.phone}`);
  });

  document.getElementById('btn-sos').addEventListener('click', () => {
    const c = getContact();
    directOpen(`tel:${c.phone}`);
  });

  // بخش تنظیمات
  const modal = document.getElementById('modal');
  function openModal() {
    const c = getContact();
    document.getElementById('inp-name').value = c.name;
    document.getElementById('inp-phone').value = c.phone;
    modal.style.display = 'flex';
  }

  document.getElementById('btn-settings').addEventListener('click', openModal);
  document.getElementById('btn-settings-bottom').addEventListener('click', openModal);

  document.getElementById('btn-save').addEventListener('click', () => {
    const name = document.getElementById('inp-name').value.trim();
    const phone = document.getElementById('inp-phone').value.trim();
    if(phone) {
      localStorage.setItem('cy_name', name || 'مراقب');
      localStorage.setItem('cy_phone', phone);
      modal.style.display = 'none';
      updateDisplay();
    }
  });

  modal.addEventListener('click', (e) => {
    if(e.target === modal) modal.style.display = 'none';
  });

  // تاریخ شمسی
  try {
    const d = new Date().toLocaleDateString('fa-IR', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    document.getElementById('date-label').innerText = '📅 ' + d;
  } catch(e){}

  updateDisplay();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
