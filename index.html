<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>چک‌یار؛ همراه و مراقب خانواده شما</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e4620">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
            background-color: #eef4f1;
            margin: 0;
            padding: 12px;
            text-align: center;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 16px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .header {
            background: linear-gradient(135deg, #1e4620, #2e7d32);
            color: white;
            padding: 20px 14px;
            border-radius: 18px;
            margin-bottom: 14px;
            position: relative;
            box-shadow: 0 4px 14px rgba(30, 70, 32, 0.25);
        }
        .settings-btn {
            position: absolute;
            left: 12px;
            top: 12px;
            background: rgba(255,255,255,0.22);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);
        }
        .settings-btn:hover { background: rgba(255,255,255,0.35); }
        
        .header-logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #ffffff;
            padding: 4px;
            object-fit: contain;
            margin: 0 auto 10px auto;
            display: block;
            box-shadow: 0 3px 10px rgba(0,0,0,0.18);
        }
        
        h1 { margin: 2px 0 4px 0; font-size: 24px; font-weight: 800; }
        .subtitle { margin: 0; font-size: 13px; opacity: 0.95; font-weight: 500; }
        
        .date-box {
            background: #f4fbf6;
            border: 1px solid #c8e6c9;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-weight: bold;
            font-size: 13px;
            color: #1e4620;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
            cursor: pointer;
            border: 2px solid #e0e0e0;
            transition: all 0.18s ease;
            user-select: none;
        }
        .card:active { transform: scale(0.96); }
        .card-shop { border-color: #ffe082; background: #fffdf5; }
        .card-med { border-color: #a5d6a7; background: #f6fbf7; }
        .card-out { border-color: #90caf9; background: #f4f9fd; }
        .card-call { border-color: #ef9a9a; background: #fdf6f6; }
        
        .card .icon { font-size: 34px; margin-bottom: 6px; display: block; }
        .card span { font-size: 15px; font-weight: bold; display: block; color: #2c3e50; }
        .card small { font-size: 11px; color: #777; margin-top: 4px; display: block; }
        .card.done small { color: #2e7d32; font-weight: bold; }

        .sos-btn {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 6px 18px rgba(211, 47, 47, 0.35);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .sos-btn:active { transform: scale(0.97); }

        /* Modal Settings */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-content {
            background: white;
            padding: 22px;
            border-radius: 18px;
            width: 100%;
            max-width: 340px;
            text-align: right;
            box-shadow: 0 12px 32px rgba(0,0,0,0.25);
        }
        .modal-content h3 { margin-top: 0; font-size: 17px; color: #1e4620; margin-bottom: 16px; }
        .modal-content label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 4px; }
        .modal-content input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 14px;
            border: 1.5px solid #d0d7de;
            border-radius: 10px;
            font-size: 14px;
            background: #fafbfc;
            direction: ltr;
            text-align: left;
        }
        .modal-content input:focus {
            outline: none;
            border-color: #2e7d32;
            background: #fff;
        }
        .modal-content button.save-btn {
            background: #1e4620;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 14px;
        }
        .modal-content button.close-btn {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <button class="settings-btn" onclick="openSettings()">⚙️ تنظیمات</button>
            <img src="icon-512.png" alt="لوگوی چک‌یار" class="header-logo" onerror="this.src='icon-192.png'">
            <h1>چک‌یار</h1>
            <p class="subtitle">چک‌یار؛ همراه و مراقب خانواده شما</p>
        </div>

        <div class="date-box" id="current-date">
            📅 امروز: در حال دریافت تاریخ...
        </div>

        <div class="grid">
            <div class="card card-shop" id="card-shop" onclick="triggerAction('خرید / قبض')">
                <span class="icon">🛒</span>
                <span>خرید / قبض</span>
                <small id="status-shop">انجام نشده</small>
            </div>
            <div class="card card-med" id="card-med" onclick="triggerAction('دارو')">
                <span class="icon">💊</span>
                <span>مصرف دارو</span>
                <small id="status-med">انجام نشده</small>
            </div>
            <div class="card card-out" id="card-out" onclick="triggerAction('اطلاع خروج')">
                <span class="icon">🚪</span>
                <span>اطلاع خروج</span>
                <small id="status-out">انجام نشده</small>
            </div>
            <div class="card card-call" onclick="makeCall()">
                <span class="icon">📞</span>
                <span>تماس سریع</span>
                <small id="contact-display">تماس با فرزند</small>
            </div>
        </div>

        <button class="sos-btn" onclick="triggerSOS()">🚨 کمک اضطراری (SOS)</button>
    </div>

    <!-- Modal Settings -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>⚙️ تنظیمات شماره تماس خانواده</h3>
            <label>نام مخاطب (فرزند/مراقب):</label>
            <input type="text" id="famName1" placeholder="مثلاً: علی (پسرم)" dir="rtl" style="text-align:right;">
            
            <label>شماره موبایل (جهت تماس و پیام):</label>
            <input type="tel" id="famPhone1" placeholder="09120000000">
            
            <button class="save-btn" onclick="saveSettings()">💾 ذخیره تنظیمات</button>
            <button class="close-btn" onclick="closeSettings()">انصراف</button>
        </div>
    </div>

    <script>
        // Set Persian Date
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', calendar: 'persian' };
        try {
            document.getElementById('current-date').innerText = "📅 " + new Date().toLocaleDateString('fa-IR', options);
        } catch(e) {
            document.getElementById('current-date').innerText = "📅 امروز: فعال";
        }

        function getFamilyPhone() {
            return localStorage.getItem('famPhone') || '09120000000';
        }

        function getFamilyName() {
            return localStorage.getItem('famName') || 'فرزند';
        }

        function refreshDisplay() {
            const name = getFamilyName();
            document.getElementById('contact-display').innerText = `تماس با ${name}`;
            updateStatuses();
        }

        function openSettings() {
            document.getElementById('famName1').value = localStorage.getItem('famName') || '';
            document.getElementById('famPhone1').value = localStorage.getItem('famPhone') || '';
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveSettings() {
            let name = document.getElementById('famName1').value.trim();
            let phone = document.getElementById('famPhone1').value.trim();
            if(!phone) {
                alert('لطفاً شماره موبایل را وارد نمایید.');
                return;
            }
            if(!name) name = 'فرزند';
            
            localStorage.setItem('famName', name);
            localStorage.setItem('famPhone', phone);
            alert('✅ تنظیمات با موفقیت ذخیره شد.');
            closeSettings();
            refreshDisplay();
        }

        function makeCall() {
            const phone = getFamilyPhone();
            window.location.href = `tel:${phone}`;
        }

        function triggerAction(actionName) {
            const phone = getFamilyPhone();
            const message = encodeURIComponent(`پیام از چک‌یار:
مورد «${actionName}» توسط سالمند ثبت شد.`);
            if(confirm(`آیا می‌خواهید وضعیت «${actionName}» را به خانواده اطلاع دهید؟`)) {
                localStorage.setItem(actionName, 'انجام شد');
                updateStatuses();
                window.location.href = `https://wa.me/98${phone.replace(/^0+/, '')}?text=${message}`;
            }
        }

        function triggerSOS() {
            const phone = getFamilyPhone();
            if(confirm('⚠️ آیا به کمک اضطراری نیاز دارید؟')) {
                window.location.href = `tel:${phone}`;
            }
        }

        function updateStatuses() {
            if(localStorage.getItem('خرید / قبض') === 'انجام شد') {
                document.getElementById('status-shop').innerText = 'انجام شد ✅';
                document.getElementById('card-shop').classList.add('done');
            }
            if(localStorage.getItem('دارو') === 'انجام شد') {
                document.getElementById('status-med').innerText = 'انجام شد ✅';
                document.getElementById('card-med').classList.add('done');
            }
            if(localStorage.getItem('اطلاع خروج') === 'انجام شد') {
                document.getElementById('status-out').innerText = 'انجام شد ✅';
                document.getElementById('card-out').classList.add('done');
            }
        }

        refreshDisplay();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
